name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug-APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk StatusbarScrollTop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StatusbarScrollTop-apk
          path: StatusbarScrollTop.apk

      # Direkter Download auf dem Handy: Repo -> Releases -> neueste "build-N"
      - name: Release mit APK anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: StatusbarScrollTop.apk
